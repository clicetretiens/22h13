<!DOCTYPE html>
<html lang="fr">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Collectif 22h13min — L’heure de l’art</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500&family=Open+Sans:wght@400;600&family=Cormorant+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
:root{--fr:#C0295E;--nv:#061F5F;--cr:#FFF3DC;--ink:#1d1d2b;--mut:#6b6577}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Open Sans',sans-serif;color:var(--ink);background:var(--cr);display:flex;flex-direction:column;min-height:100svh}
a{color:inherit}
img{display:block;max-width:100%}
header.barre{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 28px;background:var(--fr);color:var(--cr)}
.marque{display:flex;align-items:baseline;gap:8px;text-decoration:none;font-family:'Oswald',sans-serif;letter-spacing:.06em}
.marque b{font-weight:500;font-size:26px;color:var(--nv)}
.marque span{font-weight:300;font-size:13px;letter-spacing:.32em}
nav ul{list-style:none;margin:0;padding:0;display:flex;gap:22px;flex-wrap:wrap}
nav a{text-decoration:none;font-family:'Oswald',sans-serif;font-weight:400;font-size:15px;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
nav a:hover,nav a.on{opacity:1;border-bottom:2px solid var(--nv)}
main{flex:1 1 auto;display:flex;padding:28px;min-height:0}
.cadre{width:100%;max-width:1100px;margin:auto}
h1,h2{font-family:'Oswald',sans-serif;font-weight:400;color:var(--nv);letter-spacing:.04em;margin:0}
h1{font-size:clamp(34px,5vw,54px);text-transform:uppercase}
.kicker{font-family:'Oswald',sans-serif;font-size:13px;letter-spacing:.3em;text-transform:uppercase;color:var(--fr);margin:0 0 8px}
.lead{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(20px,2.4vw,26px);color:var(--fr);margin:10px 0 18px}
p{line-height:1.65;margin:0 0 12px}
footer.pied{flex:0 0 auto;text-align:center;padding:10px 20px;font-size:12px;color:var(--mut);letter-spacing:.06em}
.btn{display:inline-block;background:var(--nv);color:var(--cr);text-decoration:none;padding:10px 20px;border-radius:2px;font-family:'Oswald',sans-serif;letter-spacing:.14em;text-transform:uppercase;font-size:14px}
.btn.clair{background:transparent;color:var(--nv);border:1px solid var(--nv)}
@media(max-width:760px){
  header.barre{flex-direction:column;align-items:center;padding:10px 14px;gap:6px}
  nav ul{gap:12px;justify-content:center}
  nav a{font-size:13px;letter-spacing:.08em}
  main{padding:16px}
  h1{font-size:30px}
  .lead{margin:6px 0 10px}
}

body.accueil{background:var(--fr)}
body.accueil main{padding:28px 20px 44px}
.accueil .cadre{display:flex;flex-direction:column;align-items:center;text-align:center}
.logo{width:min(560px,82vw)}
.intro-acc{color:var(--cr);max-width:620px;margin:18px auto 26px;font-size:clamp(15px,1.6vw,18px)}
.menu{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.menu a{text-decoration:none;color:var(--cr);border:1px solid rgba(255,243,220,.6);padding:10px 20px;font-family:'Oswald',sans-serif;letter-spacing:.16em;text-transform:uppercase;font-size:15px;transition:background .25s,color .25s}
.menu a:hover{background:var(--cr);color:var(--fr)}
.menu a.fort{background:var(--nv);border-color:var(--nv)}
body.accueil footer.pied{color:rgba(255,243,220,.7)}
</style>
</head>
<body class="accueil">

<main><div class="cadre">
<img class="logo" src="img/logo-crop.jpg" alt="Collectif 22h13min — L'heure de l'art">
<p class="intro-acc">Des spectacles de musique et de théâtre pensés pour les lieux qui les accueillent : églises, châteaux, places de village, théâtres et salles de concert à taille humaine.</p>
<div class="menu">
  <a class="fort" href="projets.html">Les projets</a>
  <a href="collectif.html">Le collectif</a>
  <a href="agenda.html">Agenda</a>
  <a href="contact.html">Contact</a>
</div>
</div></main>
<footer class="pied">Collectif 22h13min · L'heure de l'art · Cournonterral, Hérault · 22h13.fr</footer>

</body>
</html>
